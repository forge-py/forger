{% extends "base.html" %}

{% block title %}Search: {{ query }}{% endblock %}

{% block content %}
<h1>Search Results for "{{ query }}"</h1>
{% for post in posts %}
<article>
    <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
    <p>{{ post.body|truncatewords:20 }}</p>
</article>
{% empty %}
<p>No results found.</p>
{% endfor %}
{% endblock %}
