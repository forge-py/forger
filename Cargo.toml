[package]
name = "forger-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "forger_core"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "forger"
path = "rust/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
crossbeam = "0.8"
rayon = "1.10"
walkdir = "2.5"
memmap2 = "0.9"
hashbrown = "0.14"
log = "0.4"
once_cell = "1.19"
bitflags = "2.5"
thiserror = "1.0"
regex = "1.10"
glob = "0.3"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# PyO3 for Python extension module (maturin)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
