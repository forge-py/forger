[package]
name = "ruff_python_ast"
version = "0.0.10"
description = "This is an internal component crate of Ruff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
edition = "2024"
rust-version = "1.95"
homepage = "https://docs.astral.sh/ruff"
documentation = "https://docs.astral.sh/ruff"
repository = "https://github.com/astral-sh/ruff"
license = "MIT"

[package.metadata.cargo-shear]
# Removed vendored `cache` feature (ruff_cache/ruff_macros not needed by forger).
ignored = ["ruff_cache"]

[package.metadata.forger]
vendored-from = "https://github.com/astral-sh/ruff"
vendored-ref = "11c76bf48fdac06b2f240cba502eda96da4dce77" # tag: 0.16.4

[lib]

[dependencies]
ruff_python_trivia = { version = "0.0.10", path = "../ruff_python_trivia" }
ruff_source_file = { version = "0.0.10", path = "../ruff_source_file" }
ruff_text_size = { version = "0.0.10", path = "../ruff_text_size" }

aho-corasick = "1.1.3"
arrayvec = "0.7.6"
bitflags = "2.5.0"
char_str = "0.0.2"
compact_str = "0.10.0"
get-size2 = { version = "0.10.3", features = [
    "derive",
    "smallvec",
    "hashbrown",
    "compact-str",
    "ordermap",
    "thin-vec",
], optional = true }
is-macro = "0.3.5"
memchr = "2.7.1"
rustc-hash = "2.0.0"
salsa = { version = "0.28.2", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
], optional = true }
schemars = { version = "1.0.4", optional = true }
serde = { version = "1.0.197", features = ["derive"], optional = true }
serde_json = { version = "1.0.113", optional = true }
thiserror = "2.0.0"
thin-vec = "0.2.14"

[features]
schemars = ["dep:schemars", "dep:serde_json"]
serde = [
    "dep:serde",
    "ruff_text_size/serde",
    "char_str/serde",
    "compact_str/serde",
    "thin-vec/serde",
]
get-size = ["dep:get-size2", "char_str/get-size", "ruff_text_size/get-size"]
salsa = ["dep:salsa"]
