[package]
name = "forger-core"
version = "0.0.0"
# Pinned to 2021: the codebase predates edition-2024 changes (implicit borrow
# patterns, unsafe_op_in_unsafe_fn) and pyo3 0.22 targets pre-2024 editions.
edition = "2021"
rust-version.workspace = true
license.workspace = true

[lib]
name = "forger_core"
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
crossbeam = "0.8"
rayon = "1.10"
walkdir = "2.5"
memmap2 = "0.9"
hashbrown = { version = "0.14", features = ["serde"] }
log = "0.4"
once_cell = "1.19"
bitflags.workspace = true
thiserror.workspace = true
regex = "1.10"
glob = "0.3"

# Vendored Ruff AST crates (see ../vendor/README.md)
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true

# PyO3 for Python extension module (maturin)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "warn"
