[project]
name = "forger"
version = "0.1.0"
description = "A Python application compiler, analyzer, bundler, and cross-platform executable builder."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forger Team" }]
dependencies = ["click>=8.1.7"]

[project.scripts]
forger = "forger.cli.__main__:run"


[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
manifest-path = "Cargo.toml"
module-name = "forger"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.pyrefly]
include = ["src/forger/", "tests/"]
exclude = ["src/forger/tests/"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90"]

[dependency-groups]
lint = ["ruff>=0.16.3"]
typing = ["pyrefly>=1.2.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
